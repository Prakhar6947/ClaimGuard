name: ClaimGuard CI — Pytest & Next.js Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: FastAPI Rule Engine & RBAC Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed database and run pytest suite
        run: |
          python -m app.seed
          pytest -v

  frontend-build:
    name: Next.js 15 TypeScript & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & build
        run: |
          npm install
          npm run build
