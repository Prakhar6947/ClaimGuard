version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: claimguard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard_local_password
      POSTGRES_DB: claimguard_nashik
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard_nashik"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: claimguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://claimguard:claimguard_local_password@db:5432/claimguard_nashik
      JWT_SECRET_KEY: local-dev-secret-key-change-in-prod
      AI_CONFIDENCE_THRESHOLD: "0.75"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: claimguard_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_ENABLE_DEMO_TOOLKIT: "true"
    depends_on:
      - backend
